<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>Gatelynk — Prototyp UX</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>/* Gatelynk Design Tokens
   Dark-first, premium residential. Purple accent.
   Both modes coexist via [data-theme] on the screen root. */

:root,
[data-theme="dark"] {
  /* Surfaces — layered dark navy */
  --bg-0: #06080F;          /* deepest, page bg outside frame */
  --bg-1: #0B1020;          /* app background */
  --bg-2: #131A2E;          /* card / sheet */
  --bg-3: #1B2440;          /* elevated card */
  --bg-4: #232E55;          /* hover / pressed */

  /* Borders & dividers */
  --border-subtle: rgba(255, 255, 255, 0.06);
  --border-default: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.18);

  /* Text */
  --text-primary: #F4F6FB;
  --text-secondary: #B7C0D8;
  --text-tertiary: #7C8AAA;
  --text-disabled: #4F5A77;

  /* Brand — soft violet, residential premium */
  --accent-50:  #F1ECFF;
  --accent-100: #E0D4FF;
  --accent-200: #C5B0FF;
  --accent-300: #A78BFA;   /* primary accent */
  --accent-400: #8B6BF0;
  --accent-500: #7050E0;
  --accent-600: #5A3EBF;
  --accent-700: #432B92;
  --accent-glow: rgba(167, 139, 250, 0.35);

  /* Semantic */
  --success: #34D399;
  --success-bg: rgba(52, 211, 153, 0.12);
  --warning: #FBBF24;
  --warning-bg: rgba(251, 191, 36, 0.14);
  --danger: #F87171;
  --danger-bg: rgba(248, 113, 113, 0.14);
  --info: #60A5FA;
  --info-bg: rgba(96, 165, 250, 0.14);

  /* Activity icons */
  --icon-orange: #F59E0B;
  --icon-orange-bg: rgba(245, 158, 11, 0.18);

  /* Shadow */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 40px var(--accent-glow);
}

[data-theme="light"] {
  --bg-0: #EEF1F8;
  --bg-1: #F6F8FC;
  --bg-2: #FFFFFF;
  --bg-3: #FFFFFF;
  --bg-4: #F0F2F8;

  --border-subtle: rgba(15, 23, 42, 0.06);
  --border-default: rgba(15, 23, 42, 0.10);
  --border-strong: rgba(15, 23, 42, 0.18);

  --text-primary: #0B1020;
  --text-secondary: #475069;
  --text-tertiary: #6E7891;
  --text-disabled: #B5BCCC;

  --accent-300: #7050E0;
  --accent-400: #5A3EBF;
  --accent-glow: rgba(112, 80, 224, 0.22);

  --success: #059669;
  --success-bg: rgba(5, 150, 105, 0.10);
  --warning: #D97706;
  --warning-bg: rgba(217, 119, 6, 0.10);
  --danger: #DC2626;
  --danger-bg: rgba(220, 38, 38, 0.10);
  --info: #2563EB;
  --info-bg: rgba(37, 99, 235, 0.10);

  --icon-orange: #EA580C;
  --icon-orange-bg: rgba(234, 88, 12, 0.14);

  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
  --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
  --shadow-glow: 0 0 40px var(--accent-glow);
}

/* Typography */
:root {
  --font-sans: 'Geist', -apple-system, 'SF Pro Text', 'Inter', system-ui, sans-serif;
  --font-display: 'Geist', -apple-system, 'SF Pro Display', system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;

  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --r-2xl: 24px;
  --r-3xl: 32px;
  --r-full: 999px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

.screen {
  background: var(--bg-1);
  color: var(--text-primary);
  font-family: var(--font-sans);
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
  letter-spacing: -0.01em;
}

.scroll-area {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.scroll-area::-webkit-scrollbar { display: none; }

html,body{margin:0;padding:0;height:100%;background:var(--canvas-bg,#0a0e1a);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;color:var(--text-primary)}
*{box-sizing:border-box}.scroll-area{overflow-y:auto;-webkit-overflow-scrolling:touch;height:100%}
[data-theme="light"]{--canvas-bg:#eef0f5}[data-theme="dark"]{--canvas-bg:#07090f}
button,input{font-family:inherit}.screen{position:relative;width:100%;height:100%}

<script type="text/babel" data-name="components/ui.jsx">
// Shared UI primitives for Gatelynk

const StatusBar = ({ time = '19:38', light = false }) => (
  <div style={{
    position: 'absolute', top: 0, left: 0, right: 0, height: 54,
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    padding: '14px 32px 0', zIndex: 10,
    color: light ? 'rgba(255,255,255,0.95)' : 'var(--text-primary)',
    fontSize: 17, fontWeight: 600, fontFamily: 'var(--font-display)',
    pointerEvents: 'none',
  }}>
    <span>{time}</span>
    <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
      <IconWifi size={17} strokeWidth={2.2} />
      <IconBattery size={22} strokeWidth={1.8} />
    </div>
  </div>
);

// Bottom tab bar — 5 tabs
const TabBar = ({ active, onChange, lang = 'pl' }) => {
  const labels = lang === 'pl'
    ? { home: 'Dom', guests: 'Goście', tickets: 'Zgłoszenia', parcels: 'Przesyłki', more: 'Więcej' }
    : { home: 'Home', guests: 'Guests', tickets: 'Tickets', parcels: 'Parcels', more: 'More' };
  const tabs = [
    { id: 'home', icon: IconHome, label: labels.home },
    { id: 'guests', icon: IconUsers, label: labels.guests },
    { id: 'tickets', icon: IconChat, label: labels.tickets },
    { id: 'parcels', icon: IconBox, label: labels.parcels },
    { id: 'more', icon: IconMore, label: labels.more },
  ];
  return (
    <div style={{
      position: 'absolute', bottom: 0, left: 0, right: 0,
      height: 96, paddingBottom: 24, paddingTop: 8,
      background: 'var(--bg-2)',
      borderTop: '1px solid var(--border-subtle)',
      display: 'flex', justifyContent: 'space-around', alignItems: 'flex-start',
      zIndex: 5,
      backdropFilter: 'blur(20px)',
    }}>
      {tabs.map(t => {
        const isActive = active === t.id;
        const C = t.icon;
        return (
          <button key={t.id}
            onClick={() => onChange?.(t.id)}
            style={{
              background: 'none', border: 'none', padding: '8px 4px',
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              gap: 4, cursor: 'pointer', flex: 1,
              color: isActive ? 'var(--accent-300)' : 'var(--text-tertiary)',
              transition: 'color 0.2s',
            }}>
            <C size={24} strokeWidth={isActive ? 2.2 : 1.8} />
            <span style={{ fontSize: 10.5, fontWeight: isActive ? 600 : 500, letterSpacing: '-0.01em' }}>
              {t.label}
            </span>
          </button>
        );
      })}
    </div>
  );
};

// Reusable card
const Card = ({ children, style = {}, onClick, padding = 16, elevated = false, ...rest }) => (
  <div onClick={onClick}
    style={{
      background: elevated ? 'var(--bg-3)' : 'var(--bg-2)',
      borderRadius: 'var(--r-xl)',
      border: '1px solid var(--border-subtle)',
      padding,
      cursor: onClick ? 'pointer' : 'default',
      transition: 'transform 0.15s, background 0.2s',
      ...style,
    }}
    {...rest}
  >{children}</div>
);

// Status pill
const Pill = ({ children, color = 'success', size = 'sm' }) => {
  const colors = {
    success: { bg: 'var(--success-bg)', fg: 'var(--success)' },
    warning: { bg: 'var(--warning-bg)', fg: 'var(--warning)' },
    danger:  { bg: 'var(--danger-bg)', fg: 'var(--danger)' },
    info:    { bg: 'var(--info-bg)', fg: 'var(--info)' },
    neutral: { bg: 'var(--bg-4)', fg: 'var(--text-secondary)' },
  };
  const c = colors[color] || colors.neutral;
  const sizes = { sm: { p: '4px 8px', fs: 11 }, md: { p: '6px 10px', fs: 12 } };
  const s = sizes[size];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: s.p, borderRadius: 'var(--r-full)',
      background: c.bg, color: c.fg,
      fontSize: s.fs, fontWeight: 600, letterSpacing: '0.02em',
    }}>{children}</span>
  );
};

// Section header
const SectionHeader = ({ title, action, actionLabel }) => (
  <div style={{
    display: 'flex', alignItems: 'center', justifyContent: 'space-between',
    marginBottom: 12, padding: '0 4px',
  }}>
    <h2 style={{
      margin: 0, fontSize: 16, fontWeight: 600,
      color: 'var(--text-primary)', letterSpacing: '-0.015em',
    }}>{title}</h2>
    {action && (
      <button onClick={action} style={{
        background: 'none', border: 'none', padding: 4,
        color: 'var(--accent-300)', fontSize: 13, fontWeight: 500,
        cursor: 'pointer',
      }}>{actionLabel}</button>
    )}
  </div>
);

// Activity item
const ActivityItem = ({ icon: I = IconMegaphone, title, subtitle, time, onClick, iconColor }) => (
  <div onClick={onClick} style={{
    display: 'flex', gap: 12, alignItems: 'flex-start',
    padding: '12px 14px', cursor: onClick ? 'pointer' : 'default',
  }}>
    <div style={{
      width: 38, height: 38, borderRadius: 'var(--r-full)',
      background: iconColor ? `${iconColor}26` : 'var(--icon-orange-bg)',
      color: iconColor || 'var(--icon-orange)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0,
    }}><I size={20} strokeWidth={2} /></div>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{
        fontSize: 13.5, fontWeight: 600, color: 'var(--text-primary)',
        lineHeight: 1.3, marginBottom: 3,
        overflow: 'hidden', textOverflow: 'ellipsis',
        display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical',
      }}>{title}</div>
      {subtitle && <div style={{
        fontSize: 12, color: 'var(--text-tertiary)',
        lineHeight: 1.3,
        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
      }}>{subtitle}</div>}
    </div>
    <div style={{ fontSize: 11, color: 'var(--text-tertiary)', whiteSpace: 'nowrap', marginTop: 2 }}>
      {time}
    </div>
  </div>
);

// FAB
const FAB = ({ onClick, icon: I = IconPlus, style = {} }) => (
  <button onClick={onClick} style={{
    position: 'absolute', right: 18, bottom: 116,
    width: 56, height: 56, borderRadius: 'var(--r-full)',
    background: 'var(--accent-300)',
    color: '#fff', border: 'none',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
    boxShadow: '0 8px 24px var(--accent-glow)',
    cursor: 'pointer', zIndex: 4, ...style,
  }}><I size={24} strokeWidth={2.2} /></button>
);

Object.assign(window, {
  StatusBar, TabBar, Card, Pill, SectionHeader, ActivityItem, FAB,
});

</script>

// AI Assistant chat sheet
const AiAssistantSheet = ({ seed = '', onClose }) => {
  const [show, setShow] = React.useState(false);
  const [input, setInput] = React.useState(seed);
  const [messages, setMessages] = React.useState([]);
  const [thinking, setThinking] = React.useState(false);
  React.useEffect(() => { requestAnimationFrame(() => setShow(true)); }, []);
  React.useEffect(() => { if (seed) setTimeout(() => send(seed), 350); }, []);

  const close = () => { setShow(false); setTimeout(onClose, 220); };

  const send = (text) => {
    const q = (text ?? input).trim();
    if (!q) return;
    setMessages(m => [...m, { role: 'user', text: q }]);
    setInput('');
    setThinking(true);
    setTimeout(() => {
      setThinking(false);
      setMessages(m => [...m, { role: 'ai', text: mockReply(q) }]);
    }, 1100);
  };

  return (

// Inline slide-to-open row (each has independent state)
const SliderRow = ({ icon: I, label, sub }) => {
  const [state, setState] = React.useState('idle'); // idle | opening | open
  const [x, setX] = React.useState(0);
  const trackRef = React.useRef(null);

  const start = (e) => {
    if (state !== 'idle') return;
    const rect = trackRef.current.getBoundingClientRect();
    const max = rect.width - 56 - 6;
    const startX = e.touches ? e.touches[0].clientX : e.clientX;
    let last = 0;
    const move = (ev) => {
      const dx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - startX;
      last = Math.max(0, Math.min(max, dx));
      setX(last);
      if (last >= max - 4) { end(); fire(); }
    };
    const end = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', end);
      if (last < max - 4) setX(0);
    };
    const fire = () => {
      setState('opening');
      setX(max);
      setTimeout(() => setState('open'), 1400);
      setTimeout(() => { setState('idle'); setX(0); }, 4000);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    window.addEventListener('touchmove', move);
    window.addEventListener('touchend', end);
  };

  const isOpen = state === 'open';
  const isOpening = state === 'opening';

  return (
    <div style={{
      background: 'var(--bg-2)',
      border: '1px solid var(--border-subtle)',
      borderRadius: 'var(--r-xl)',
      padding: 12,
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 10, padding: '2px 4px' }}>
        <RowIcon I={I}/>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 14.5, fontWeight: 600, color: 'var(--text-primary)', letterSpacing: '-0.01em' }}>{label}</div>
          <div style={{ fontSize: 11.5, color: 'var(--text-tertiary)', marginTop: 2 }}>
            {isOpen ? '✓ Otwarta' : isOpening ? 'Otwieranie…' : sub}
          </div>
        </div>
      </div>
      <div ref={trackRef} style={{
        position: 'relative', height: 56,
        background: 'var(--bg-3)',
        border: '1px solid var(--border-subtle)',
        borderRadius: 'var(--r-full)',
        overflow: 'hidden',
        display: 'flex', alignItems: 'center',
      }}>
        <div style={{
          position: 'absolute', left: 0, top: 0, bottom: 0,
          width: x + 56,
          background: isOpen
            ? 'linear-gradient(90deg, rgba(52,211,153,0.7), rgba(52,211,153,0.4))'
            : 'linear-gradient(90deg, var(--accent-400), var(--accent-300))',
          opacity: 0.85,
          transition: state !== 'idle' ? 'width 0.4s, background 0.3s' : 'none',
        }}/>
        <span style={{
          position: 'absolute', left: 0, right: 0, textAlign: 'center',
          fontSize: 13, fontWeight: 600,
          color: x > 60 || isOpen ? '#fff' : 'rgba(255,255,255,0.55)',
          pointerEvents: 'none', letterSpacing: '0.01em',
        }}>
          {isOpen ? 'Otwarta ✓' : isOpening ? 'Otwieranie…' : '→  Przesuń, aby otworzyć'}
        </span>
        <div onMouseDown={start} onTouchStart={start} style={{
          position: 'absolute', left: 4, top: 4,
          width: 48, height: 48, borderRadius: '50%',
          background: '#fff',
          transform: `translateX(${x}px)`,
          transition: state !== 'idle' && state !== 'open' ? 'transform 0.4s' : (x === 0 ? 'transform 0.3s' : 'none'),
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          cursor: state === 'idle' ? 'grab' : 'default',
          boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
        }}>
          {isOpen ? <IconCheck size={20} color="var(--success)" strokeWidth={2.4}/> : <IconUnlock size={20} color="var(--accent-500)" strokeWidth={2.2}/>}
        </div>
      </div>
    </div>
  );
};

    if (locked || autoLock === 0) { setCountdown(0); return; }

            setBusy(false);
            setLastEvent({ text: 'Zamknięte automatycznie · teraz', via: 'auto' });

<script type="text/babel" data-name="screens/gate.jsx">
// Full-screen gate opening flow — 3 interaction variants
// Variants: 'tap', 'hold', 'slide'

const GateScreen = ({ direction = 'entry', variant = 'hold', onClose, onComplete }) => {
  const [state, setState] = React.useState('idle'); // idle | opening | open | closing
  const [progress, setProgress] = React.useState(0);
  const holdRef = React.useRef(null);
  const slideRef = React.useRef(null);
  const [slideX, setSlideX] = React.useState(0);

  const targets = {
    entry: { label: 'Wjazd', sub: 'Brama główna · Niewinna 1', danger: false },
    exit:  { label: 'Wyjazd', sub: 'Brama tylna · Niewinna 1', danger: false },
    fire:  { label: 'Brama pożarowa', sub: 'Wyjście awaryjne', danger: true },
    home:  { label: 'Mój dom', sub: 'Drzwi wejściowe', danger: false },
  };
  const t = targets[direction] || targets.entry;
  const label = t.label;
  const sub = t.sub;
  const isDanger = t.danger;

  const trigger = () => {
    if (state !== 'idle') return;
    setState('opening');
    setTimeout(() => setState('open'), 1800);
    setTimeout(() => setState('closing'), 5000);
    setTimeout(() => onComplete?.(), 6500);
  };

  // Hold-to-open
  const startHold = () => {
    if (state !== 'idle') return;
    let p = 0;
    holdRef.current = setInterval(() => {
      p += 4;
      setProgress(p);
      if (p >= 100) {
        clearInterval(holdRef.current);
        trigger();
      }
    }, 30);
  };
  const cancelHold = () => {
    if (holdRef.current) clearInterval(holdRef.current);
    if (state === 'idle') setProgress(0);
  };

  // Slide-to-open
  const SLIDE_MAX = 220;
  const onSlideStart = (e) => {
    if (state !== 'idle') return;
    const startX = e.touches ? e.touches[0].clientX : e.clientX;
    const move = (ev) => {
      const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - startX;
      const clamped = Math.max(0, Math.min(SLIDE_MAX, x));
      setSlideX(clamped);
      if (clamped >= SLIDE_MAX - 4) {
        end();
        trigger();
      }
    };
    const end = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', end);
      window.removeEventListener('touchmove', move);
      window.removeEventListener('touchend', end);
      if (slideX < SLIDE_MAX - 4) setSlideX(0);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', end);
    window.addEventListener('touchmove', move);
    window.addEventListener('touchend', end);
  };

  const statusText = {
    idle: variant === 'tap' ? 'Naciśnij, aby otworzyć' : variant === 'hold' ? 'Przytrzymaj, aby otworzyć' : 'Przesuń, aby otworzyć',
    opening: 'Otwieranie...',
    open: 'Brama otwarta',
    closing: 'Zamykanie...',
  }[state];

  const statusColor = state === 'open' ? 'var(--success)' : state === 'idle' ? 'var(--text-secondary)' : 'var(--accent-300)';

  return (
    <div className="screen" style={{
      background: state === 'open'
        ? 'radial-gradient(circle at center, rgba(52,211,153,0.18) 0%, var(--bg-1) 60%)'
        : state === 'opening' || state === 'closing'
        ? 'radial-gradient(circle at center, rgba(167,139,250,0.18) 0%, var(--bg-1) 60%)'
        : 'var(--bg-1)',
      transition: 'background 0.6s',
    }}>
      <StatusBar />

      {/* Close */}
      <button onClick={onClose} style={{
        position: 'absolute', top: 60, left: 16, zIndex: 5,
        width: 40, height: 40, borderRadius: '50%',
        background: 'var(--bg-2)', border: '1px solid var(--border-subtle)',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        color: 'var(--text-primary)', cursor: 'pointer',
      }}><IconClose size={18}/></button>

      {/* Direction label top */}
      <div style={{ position: 'absolute', top: 60, left: 0, right: 0, textAlign: 'center', zIndex: 4 }}>
        <div style={{ fontSize: 12, color: 'var(--text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.15em', fontWeight: 600 }}>
          Otwieranie · {label}
        </div>
      </div>

      {/* Center stage */}
      <div style={{
        position: 'absolute', top: 0, left: 0, right: 0, bottom: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
        padding: '0 24px',
      }}>
        {/* Animated gate visual */}
        <GateVisual state={state} />

        {/* Status */}
        <div style={{ marginTop: 32, textAlign: 'center' }}>
          <div style={{ fontSize: 26, fontWeight: 700, color: 'var(--text-primary)', letterSpacing: '-0.02em' }}>{label}</div>
          <div style={{ fontSize: 13, color: 'var(--text-tertiary)', marginTop: 4 }}>{sub}</div>
          <div style={{
            marginTop: 18, display: 'inline-flex', alignItems: 'center', gap: 8,
            padding: '8px 14px', borderRadius: 'var(--r-full)',
            background: 'var(--bg-2)', border: '1px solid var(--border-subtle)',
          }}>
            <span style={{ width: 8, height: 8, borderRadius: '50%', background: statusColor,
              animation: state !== 'idle' && state !== 'open' ? 'pulse 1.2s infinite' : 'none' }}/>
            <span style={{ fontSize: 13, fontWeight: 500, color: statusColor }}>{statusText}</span>
          </div>
        </div>
      </div>

      {/* Bottom action */}
      <div style={{
        position: 'absolute', bottom: 60, left: 0, right: 0,
        padding: '0 24px',
      }}>
        {variant === 'tap' && (
          <button
            onClick={trigger}
            disabled={state !== 'idle'}
            style={{
              width: '100%', padding: '20px',
              background: state === 'idle'
                ? 'linear-gradient(180deg, var(--accent-300), var(--accent-500))'
                : 'var(--bg-3)',
              border: 'none', borderRadius: 'var(--r-2xl)',
              color: '#fff', fontSize: 17, fontWeight: 700, letterSpacing: '-0.01em',
              cursor: state === 'idle' ? 'pointer' : 'default',
              boxShadow: state === 'idle' ? '0 12px 30px var(--accent-glow)' : 'none',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            }}>
            <IconUnlock size={20} strokeWidth={2.2}/>
            Otwórz {label.toLowerCase()}
          </button>
        )}

        {variant === 'hold' && (
          <button
            onMouseDown={startHold} onMouseUp={cancelHold} onMouseLeave={cancelHold}
            onTouchStart={startHold} onTouchEnd={cancelHold}
            disabled={state !== 'idle'}
            style={{
              width: '100%', padding: '20px',
              background: 'var(--bg-2)',
              border: '1px solid var(--border-default)',
              borderRadius: 'var(--r-2xl)',
              color: 'var(--text-primary)', fontSize: 16, fontWeight: 600,
              cursor: state === 'idle' ? 'pointer' : 'default',
              position: 'relative', overflow: 'hidden',
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10,
            }}>
            <div style={{
              position: 'absolute', top: 0, left: 0, bottom: 0,
              width: `${state === 'idle' ? progress : 100}%`,
              background: 'linear-gradient(90deg, var(--accent-400), var(--accent-300))',
              transition: progress === 0 ? 'width 0.3s' : 'none',
              opacity: 0.85,
            }}/>
            <span style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 10, color: progress > 50 ? '#fff' : 'var(--text-primary)' }}>
              <IconUnlock size={20}/>
              Przytrzymaj, aby otworzyć
            </span>
          </button>
        )}

        {variant === 'slide' && (
          <div ref={slideRef}
            style={{
              position: 'relative',
              width: '100%', height: 64,
              background: 'var(--bg-2)',
              border: '1px solid var(--border-default)',
              borderRadius: 'var(--r-full)',
              overflow: 'hidden',
              display: 'flex', alignItems: 'center',
            }}>
            <div style={{
              position: 'absolute', left: 0, top: 0, bottom: 0,
              width: slideX + 64,
              background: 'linear-gradient(90deg, var(--accent-400), var(--accent-300))',
              opacity: 0.8,
            }}/>
            <span style={{
              position: 'absolute', left: 0, right: 0, textAlign: 'center',
              fontSize: 14, fontWeight: 600, color: slideX > 80 ? '#fff' : 'var(--text-secondary)',
              pointerEvents: 'none',
            }}>→ Przesuń, aby otworzyć</span>
            <div
              onMouseDown={onSlideStart} onTouchStart={onSlideStart}
              style={{
                position: 'absolute', left: 4, top: 4,
                width: 56, height: 56, borderRadius: '50%',
                background: '#fff',
                transform: `translateX(${slideX}px)`,
                transition: slideX === 0 ? 'transform 0.3s' : 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'grab', boxShadow: '0 4px 12px rgba(0,0,0,0.3)',
              }}>
              <IconUnlock size={22} color="var(--accent-500)" strokeWidth={2.2}/>
            </div>
          </div>
        )}

        <div style={{ marginTop: 14, textAlign: 'center', fontSize: 11, color: 'var(--text-tertiary)' }}>
          🔒 Połączenie szyfrowane · Sygnał silny
        </div>
      </div>

      <style>{`
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(1.4); }
        }
        @keyframes gate-open-l {
          from { transform: rotateY(0); } to { transform: rotateY(-75deg); }
        }
        @keyframes gate-open-r {
          from { transform: rotateY(0); } to { transform: rotateY(75deg); }
        }
        @keyframes ripple {
          0% { transform: scale(0.8); opacity: 0.6; }
          100% { transform: scale(2.2); opacity: 0; }
        }
      `}</style>
    </div>
  );
};

const GateVisual = ({ state }) => {
  const opening = state === 'opening' || state === 'open';
  const open = state === 'open';

  return (
    <div style={{
      width: 200, height: 200, position: 'relative',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      perspective: 800,
    }}>
      {/* Pulse rings when open */}

const COLOR_OPTIONS = [

  { name: 'Biały',     hex: '#F5F5F5' },
  { name: 'Srebrny',   hex: '#C9CCD1' },
  { name: 'Szary',     hex: '#7A7E85' },
  { name: 'Granatowy', hex: '#1E2A4A' },
  { name: 'Niebieski', hex: '#3B6FE0' },
  { name: 'Czerwony',  hex: '#D43F3F' },
  { name: 'Zielony',   hex: '#3F7A52' },
  { name: 'Żółty',     hex: '#E8C547' },
  { name: 'Pomarańczowy', hex: '#E08F3B' },
  { name: 'Brązowy',   hex: '#6B4A2B' },
  { name: 'Inny',      hex: 'transparent', isOther: true },
];
const colorHex = (name) => (COLOR_OPTIONS.find(c => c.name === name)?.hex) || '#7A7E85';

// =====================================================
// VEHICLES SCREEN
// =====================================================
const VehiclesScreen = ({ data, onBack }) => {
  const [vehicles, setVehicles] = React.useState(data.vehicles || []);
  const [editing, setEditing] = React.useState(null); // null | 'new' | vehicle id

  if (editing) {
    const initial = editing === 'new' ? null : vehicles.find(v => v.id === editing);
    return (
      <VehicleEditor
        initial={initial}
        onCancel={() => setEditing(null)}
        onDelete={() => { setVehicles(vehicles.filter(v => v.id !== editing)); setEditing(null); }}
        onSave={(v) => {
          if (editing === 'new') setVehicles([...vehicles, { ...v, id: 'v' + Date.now() }]);
          else setVehicles(vehicles.map(x => x.id === editing ? { ...x, ...v } : x));
          setEditing(null);
        }}
      />
    );
  }

  return (
    <div className="screen scroll-area" style={{ paddingBottom: 110 }}>
      <StatusBar />
      <ScreenHeader title="Pojazdy" onBack={onBack}/>

const GuestsScreen = ({ data, onBack }) => {
  const [guests, setGuests] = React.useState(data.guests || []);
  const [view, setView] = React.useState('list'); // list | new | view:id

  if (view === 'new' || (typeof view === 'string' && view.startsWith('view:'))) {
    const editing = view === 'new' ? null : guests.find(g => g.id === view.slice(5));
    return (
      <GuestInvite
        myVehicles={data.vehicles || []}
        initial={editing}
        onCancel={() => setView('list')}
        onSave={(g) => {
          if (view === 'new') setGuests([{ ...g, id: 'g' + Date.now(), status: 'upcoming' }, ...guests]);
          else setGuests(guests.map(x => x.id === editing.id ? { ...x, ...g } : x));
          setView('list');
        }}
        onRevoke={() => { setGuests(guests.filter(g => g.id !== editing.id)); setView('list'); }}
      />
    );
  }

  const grouped = {
    active:   guests.filter(g => g.status === 'active'),
    upcoming: guests.filter(g => g.status === 'upcoming'),
    expired:  guests.filter(g => g.status === 'expired'),

  return (

const fmtTimeRange = (from, to) => {
  if (!from || !to) return '';
  const f = new Date(from), t = new Date(to);
  const d = f.toLocaleDateString('pl-PL', { day: '2-digit', month: 'short' });
  const tf = f.toTimeString().slice(0,5);
  const tt = t.toTimeString().slice(0,5);
  return `${d}, ${tf}–${tt}`;
};

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',

        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',

      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',

}

// ─────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';

    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';

function IOSList({ header, children, dark = false }) {

// ─────────────────────────────────────────────────────────────
// Device frame

function IOSDevice({

    <div key={k} style={{

      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{

              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',

      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,

        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>

          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>

          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel" data-name="app.jsx">
// Top-level prototype app — composes everything

const { useState, useEffect } = React;

const HOME_VARIANTS = [
  { id: 'v1', label: 'Refined Classic', sub: 'Cleanup wersji obecnej', component: 'HomeV1' },
  { id: 'v2', label: 'Big Action', sub: 'Brama jako gwiazda', component: 'HomeV2' },
  { id: 'v3', label: 'Glass Premium', sub: 'Frosted glass + zdjęcia', component: 'HomeV3' },
  { id: 'v4', label: 'Minimal', sub: 'Linie, biel, kontrast', component: 'HomeV4' },
  { id: 'v5', label: 'Smart Dashboard', sub: 'Smart-home tiles', component: 'HomeV5' },
  { id: 'v6', label: 'Activity Feed', sub: 'Timeline-first', component: 'HomeV6' },
];

const GATE_VARIANTS = [
  { id: 'tap',   label: 'Tap', sub: 'Jeden naciśnięcie' },
  { id: 'hold',  label: 'Hold', sub: '3 sekundy przytrzymania' },
  { id: 'slide', label: 'Slide', sub: 'Przesuń do końca' },
];

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "homeVariant": "v3",
  "gateVariant": "hold",
  "theme": "light",
  "showHero": true,
  "showPayments": true
}/*EDITMODE-END*/;

const App = () => {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [activeTab, setActiveTab] = useState('home');
  const [gateOpen, setGateOpen] = useState(null); // null | 'entry' | 'exit'

  const data = MOCK_DATA;
  const HomeComp = window[HOME_VARIANTS.find(v => v.id === tweaks.homeVariant)?.component] || HomeV2;

  const onOpenGate = (dir) => setGateOpen(dir);
  const onGateClose = () => setGateOpen(null);

  let body;
  if (activeTab === 'home') {
    body = <HomeComp data={data} onOpenGate={onOpenGate} onOpenGuests={() => setActiveTab('guests')} showHero={tweaks.showHero} showPayments={tweaks.showPayments}/>;
  } else if (activeTab === 'notif') {
    body = <NotificationsScreen data={data} onBack={() => setActiveTab('home')}/>;
  } else if (activeTab === 'tickets') {
    body = <TicketsScreen data={data} onBack={() => setActiveTab('home')}/>;
  } else if (activeTab === 'parcels') {
    body = <ParcelsScreen data={data} onBack={() => setActiveTab('home')}/>;
  } else if (activeTab === 'vehicles') {
    body = <VehiclesScreen data={data} onBack={() => setActiveTab('more')}/>;
  } else if (activeTab === 'guests') {
    body = <GuestsScreen data={data} onBack={() => setActiveTab('home')}/>;
  } else if (activeTab === 'more') {
    body = <ProfileScreen data={data} onBack={() => setActiveTab('home')} theme={tweaks.theme} onTheme={(t) => setTweak('theme', t)} onOpenVehicles={() => setActiveTab('vehicles')} onOpenGuests={() => setActiveTab('guests')}/>;
  }

  return (
    <div data-theme={tweaks.theme} style={{ width: '100%', height: '100%', position: 'relative' }}>
      {gateOpen ? (
        <GateScreen
          direction={gateOpen}
          variant={tweaks.gateVariant}
          onClose={onGateClose}
          onComplete={onGateClose}
        />
      ) : (
        <>
          {body}
          <TabBar active={activeTab} onChange={setActiveTab}/>
        </>
      )}

      {/* Tweaks panel */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Wariant ekranu Dom" />
        <TweakSelect
          label="Layout"
          value={tweaks.homeVariant}
          onChange={(v) => setTweak('homeVariant', v)}
          options={HOME_VARIANTS.map(v => ({ value: v.id, label: `${v.label} — ${v.sub}` }))}
        />
        <TweakSection label="Otwieranie bramy" />
        <TweakRadio
          label="Interakcja"
          value={tweaks.gateVariant}
          onChange={(v) => setTweak('gateVariant', v)}
          options={GATE_VARIANTS.map(v => ({ value: v.id, label: v.label }))}
        />
        <TweakSection label="Wygląd" />
        <TweakRadio
          label="Motyw"
          value={tweaks.theme}
          onChange={(v) => setTweak('theme', v)}
          options={[{ value: 'dark', label: 'Ciemny' }, { value: 'light', label: 'Jasny' }]}
        />
        <TweakToggle
          label="Zdjęcie osiedla"
          value={tweaks.showHero}
          onChange={(v) => setTweak('showHero', v)}
        />
        <TweakToggle
          label="Karta płatności"
          value={tweaks.showPayments}
          onChange={(v) => setTweak('showPayments', v)}
        />
        <TweakSection label="Test" />
        <TweakButton label="Otwórz wjazd (test)" onClick={() => setGateOpen('entry')}/>
      </TweaksPanel>
    </div>
  );
};

// Mount inside iOS frame
const root = ReactDOM.createRoot(document.getElementById('root'));
const Root = () => {
  // Read theme from the App's stored tweaks for correct frame chrome
  const stored = (() => {
    try { return JSON.parse(localStorage.getItem('__tweaks') || '{}'); } catch { return {}; }
  })();
  const theme = stored.theme || 'light';
  return (
    <IOSDevice dark={theme === 'dark'}>
      <App />
    </IOSDevice>
  );
};
root.render(<Root />);

;try{Object.assign(window, { HOME_VARIANTS: typeof HOME_VARIANTS!=='undefined'?HOME_VARIANTS:undefined, GATE_VARIANTS: typeof GATE_VARIANTS!=='undefined'?GATE_VARIANTS:undefined, TWEAK_DEFAULTS: typeof TWEAK_DEFAULTS!=='undefined'?TWEAK_DEFAULTS:undefined, App: typeof App!=='undefined'?App:undefined, Root: typeof Root!=='undefined'?Root:undefined });}catch(e){}
</script>
