# ─────────────────────────────────────────────────────────────────────────────
# coturn — TURN/STUN server dla domofonu Akuvox ↔ iOS (off-site relay).
# Projekt: docs/intercom-akuvox-call.md (D3 = VPS, region Frankfurt FRA).
#
# Ten serwer JEST publicznym punktem styku dla iPhone'a poza LAN-em i dla Janusa
# na Edge (Mac Mini za NAT). Bez niego połączenie off-site nie zestawi się gdy
# NAT obu stron jest symetryczny. Patrz README.md w tym katalogu (instalacja,
# firewall, cert, systemd, test).
#
# WAŻNE — przed startem podmień placeholdery:
#   <PUBLIC_IP>      publiczny IPv4 VPS-a (np. 5.75.xxx.xxx)
#   <TURN_REALM>     realm = domena TURN (np. turn.gatelynk.com)
#   <STATIC_SECRET>  losowy sekret dla TURN REST API (use-auth-secret).
#                    Wygeneruj: openssl rand -hex 32
# ─────────────────────────────────────────────────────────────────────────────

# ── Porty nasłuchu ───────────────────────────────────────────────────────────
# 3478 = STUN/TURN plain (UDP+TCP). 5349 = TURN over TLS/DTLS.
listening-port=3478
tls-listening-port=5349

# Publiczny IP VPS-a. Na VPS z 1:1 NAT (rzadko) ustaw też external-ip=PUB/PRIV.
listening-ip=0.0.0.0
external-ip=<PUBLIC_IP>

# Zakres portów relay (media). MUSI być otwarty w firewallu/security group VPS-a
# jako UDP. 16384 portów wystarcza na ~setki równoległych sesji.
min-port=49152
max-port=65535

# ── Realm + autoryzacja ──────────────────────────────────────────────────────
# Realm = logiczna domena TURN. Wstawiany do credentiali które Cloud generuje
# i zapisuje w BuildingIntercom.turnUrl/turnUsername/turnPassword.
realm=<TURN_REALM>

# WYBÓR MECHANIZMU AUTORYZACJI (wybrany: use-auth-secret / TURN REST API):
#
#   use-auth-secret — Cloud generuje krótkożyciowe credentials (HMAC-SHA1 z
#   static-auth-secret). username = "<unix_expiry>:<arbitrary>", password =
#   base64(HMAC-SHA1(static-auth-secret, username)). iOS i Janus dostają te same
#   ICE creds (ważne np. 12 h). To preferowany wariant — brak trwałych haseł na
#   serwerze, łatwa rotacja, time-boxed. Cloud wypełnia turnUsername/turnPassword
#   per sesja przy INVITE (TODO Faza C: implementacja generatora w Cloud).
use-auth-secret
static-auth-secret=<STATIC_SECRET>

#   ── Alternatywa (long-term creds) — odkomentuj zamiast use-auth-secret powyżej
#   jeśli wolisz statyczne user/pass na start (prościej, ale brak rotacji):
# lt-cred-mech
# user=gatelynk:<STATIC_PASSWORD>
#   Wtedy turnUsername=gatelynk, turnPassword=<STATIC_PASSWORD> wpisz ręcznie
#   w BuildingIntercom.

# ── TLS (dla tls-listening-port 5349) ────────────────────────────────────────
# Cert Let's Encrypt dla <TURN_REALM> — patrz README (certbot). Ścieżki domyślne:
cert=/etc/letsencrypt/live/<TURN_REALM>/fullchain.pem
pkey=/etc/letsencrypt/live/<TURN_REALM>/privkey.pem
# Wymuś nowoczesne ciphery; wyłącz przestarzałe protokoły.
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM"

# ── Bezpieczeństwo / hardening ───────────────────────────────────────────────
# Wymuś fingerprint w wiadomościach STUN/TURN (wymóg WebRTC).
fingerprint
# Nie pozwalaj relay-ować na loopback ani na sieci prywatne/multicast — chroni
# przed użyciem TURN-a jako proxy do wewnętrznej infry VPS-a.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# Limit przepustowości per sesja (bps) — chroni przed nadużyciem. 3 Mbps starcza
# dla audio + 720p H.264 (D4 passthrough). Dostosuj do bitrate Akuvoxa.
max-bps=3000000
# Limit liczby relay per allokację.
user-quota=12
total-quota=1200

# ── Logi ─────────────────────────────────────────────────────────────────────
log-file=/var/log/turnserver/turnserver.log
simple-log
# Wyłącz CLI telnet admina (port 5766) — niepotrzebny, zmniejsza powierzchnia.
no-cli

# ── Wyłącz nieużywane ────────────────────────────────────────────────────────
# Nie potrzebujemy starego STUN-only mode ani mobility ICE.
no-stun-backward-compatibility
stale-nonce=600
