# ─────────────────────────────────────────────────────────────────────────────
# GateLynk AI Assistant — katalog pytań referencyjnych (golden set).
#
# Każdy wpis:
#   q:         pytanie użytkownika (PL, dokładnie tak jak przychodzi do /ask)
#   intent:    oczekiwany intent (musi być w VALID_INTENTS)
#   params:    OPCJONALNE — subset oczekiwanych parametrów. Porównywane są
#              TYLKO klucze wymienione tutaj (katalog nie musi wymieniać
#              wszystkich defaultów które classifier dokłada).
#   absent:    OPCJONALNE — lista kluczy które NIE mogą wystąpić w parametrach
#              (np. generic śmieciarka nie może dostać category).
#   needs_llm: OPCJONALNE — true gdy pytanie NIE matchuje regexów i wymaga
#              LLM fallbacku. Domyślnie pomijane; testowane tylko z flagą
#              --llm w eval_classifier.py (wolne, wymaga Ollama w sieci).
#   history:   OPCJONALNE — lista tur [{role: user|assistant, content: ...}].
#              Gdy obecna, eval NAJPIERW przepuszcza q przez deterministyczny
#              rewrite (conversation.deterministic_rewrite — carry-over
#              marki/koloru/tablicy z historii, BEZ LLM), potem klasyfikuje.
#              To dokładnie produkcyjna ścieżka /ask dla follow-upów.
#
# Uruchomienie: cd apps/ai-prototype && python3 eval_classifier.py
#
# Historia zgłoszeń pokryta wprost (CLAUDE.md 8.h.12–8.h.17):
#   • "Kiedy ostatnio był Uber?"               → search_by_brand_today (8.h.12)
#   • "Kiedy ostatnio było FRISCO?"            → search_by_brand_today (8.h.13)
#   • "Czy był Media Expert?"                  → search_by_brand_today (8.h.13)
#   • "Kiedy ostatnio była śmieciarka?"        → search_by_waste_today (HISTORIA)
#   • "Kiedy jest planowany odbiór śmieci?"    → search_knowledge_base (8.h.14)
#   • "Kiedy następny odbiór śmieci?"          → search_knowledge_base (8.h.14)
#   • "Co dziś jest zaplanowane na osiedlu?"   → search_knowledge_base (8.h.17)
#   • odmiany per-frakcja (szkło/papier/bio/zmieszane × ostatnio/planowany)
# ─────────────────────────────────────────────────────────────────────────────

