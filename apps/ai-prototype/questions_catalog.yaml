# ── multi-turn follow-upy (history → deterministyczny carry-over) ────────────
# Zgłoszenie prod b9 2026-07-05 19:34: po pytaniu o markę follow-up
# „Jakie miały numery rejestracyjne ?" → intent=unknown. Fix 8.h.33:
# conversation._inject_plates_subject_from_history. Wpisy z `history:`
# testują CAŁY łańcuch deterministic_rewrite → classify_regex (bez LLM).
- q: "Jakie miały numery rejestracyjne ?"
  history:
    - { role: user, content: "A czy widziałeś jakąś Toyotę ?" }
    - { role: assistant, content: "Tak — Toyota (WW5975W): ostatni wyjazd 2026-07-04 19:17. Łącznie 25 przejazdów." }
  intent: search_by_vehicle_make
  params: { make: Toyota, range_hours: 720 }
# Okno czasowe z pytania które wywołało odpowiedź (12h) musi przetrwać:
- q: "Jakie miały numery rejestracyjne?"
  history:
    - { role: user, content: "Ile Mercedesów widziałeś w ostatnich 12 godzinach ?" }
    - { role: assistant, content: "W ostatnich 12 godzinach nie zarejestrowałem pojazdów marki Mercedes." }
  intent: search_by_vehicle_make
  params: { make: Mercedes, range_hours: 12 }
- q: "jakie tablice?"
  history:
    - { role: user, content: "A czy widziałeś jakąś Toyotę ?" }
    - { role: assistant, content: "Tak, dziś zarejestrowałem 2 pojazdy marki Toyota." }
  intent: search_by_vehicle_make
  params: { make: Toyota, range_hours: 720 }
- q: "podaj numery rejestracyjne"
  history:
    - { role: user, content: "Czy widziałeś Toyotę?" }
    - { role: assistant, content: "Tak, widziałem." }
  intent: search_by_vehicle_make
  params: { make: Toyota, range_hours: 720 }
# Kolor z historii → intent kolorowy (jego odpowiedź niesie tablice):
- q: "Jakie miały tablice?"
  history:
    - { role: user, content: "Jakie czerwone auta były dziś?" }
    - { role: assistant, content: "Dziś były 2 czerwone auta." }
  intent: list_vehicles_by_color_today
  params: { color: red }
# Własny temat (nieznane tablice) — carry-over NIE może wstrzyknąć marki:
- q: "Jakie nieznane tablice były dziś?"
  history:
    - { role: user, content: "Czy widziałeś Toyotę?" }
    - { role: assistant, content: "Nie, dziś nie widziałem takiego pojazdu." }
  intent: list_unmatched_plates
# 8.h.23 — plate-injection: pytanie o pojazd bez tablicy + tablica w historii:
- q: "Do kogo należy pojazd?"
  history:
    - { role: user, content: "Kiedy ostatnio widziano WD5005P?" }
    - { role: assistant, content: "Ostatnio widziano WD5005P 11 czerwca o 18:11." }
  intent: vehicle_owner_by_plate
  params: { plate: WD5005P }
# 8.h.32 — window-change follow-up zachowuje markę z historii:
- q: "A wcześniej? W ciągu 24 godzin?"
